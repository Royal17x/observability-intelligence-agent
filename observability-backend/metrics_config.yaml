services:
  flagr:
    rps: 'rate(flagr_http_requests_total{job="{service}"}[{range}])'
    p99: 'histogram_quantile(0.99, rate(flagr_http_request_duration_seconds_bucket{job="{service}"}[{range}]))'
    errors: 'rate(flagr_http_requests_total{job="{service}",status=~"5.."}[{range}])'

  default:
    rps: 'rate(http_requests_total{job="{service}"}[{range}])'
    p99: 'histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{job="{service}"}[{range}]))'
    errors: 'rate(http_requests_total{job="{service}",status=~"5.."}[{range}])'